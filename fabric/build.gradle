plugins {
    id "net.fabricmc.fabric-loom"
}

base {
    archivesName = "${rootProject.mod_id}-fabric"
}

sourceSets {
    main {
        java.srcDirs += ["../common/src/main/java"]
        resources.srcDirs += ["../common/src/main/resources"]
    }
}

loom {
    mods {
        "${rootProject.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    annotationProcessor "io.github.llamalad7:mixinextras-common:${mixin_extras_version}"
    implementation "io.github.llamalad7:mixinextras-fabric:${mixin_extras_version}"
}

processResources {
    def replaceProperties = [
            minecraft_version    : minecraft_version,
            minecraft_min_version: minecraft_min_version,
            minecraft_max_version: minecraft_max_version,
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_version          : mod_version,
            mod_license          : mod_license,
            mod_authors          : mod_authors,
            mod_description      : mod_description,
            mod_credits          : mod_credits,
            mod_homepage         : mod_homepage,
            mod_github           : mod_github,
            cca_version          : cca_version
    ]

    inputs.properties replaceProperties

    filesMatching("fabric.mod.json") {
        expand replaceProperties + [project: project]
    }
}
